<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>阿录｜表格相册白板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family: system-ui, sans-serif;}
body{overflow:hidden;height:100vh;background:#f6f6f6;}
#canvasWrap{width:100%;height:100%;position:relative;overflow:hidden;cursor:grab;}
#canvasWrap:active{cursor:grabbing;}
#canvas{position:absolute;width:5000px;height:5000px;background-image: radial-gradient(#ddd 1px, transparent 1px);background-size: 20px 20px;}
.card{
  position:absolute;
  min-width:360px;
  min-height:220px;
  padding:10px;
  border-radius:8px;
  box-shadow: 2px 2px  10px #00000020;
  background:#fff;
}
.card.y{background:#fff9b0;}
.card.b{background:#e6f2ff;}
.card.p{background:#ffeef6;}
.card.w{background:#ffffff;}
.card-header{
  display:flex;justify-content: space-between;align-items:center;padding-bottom:6px;
}
.card-title{font-weight:500;font-size:14px;outline:none;border:none;background:transparent;}
.card-ctrl button{border:none;background:#0002;padding: 2px 5px;margin:0 1px;border-radius:4px;font-size:12px;cursor:pointer;}
.table-container{width:100%;overflow:auto;border:1px solid #ccc;}
.grid-table{
  border-collapse: collapse;
  width:max-content;
}
.grid-table th.col-label{
  background:#00a854;
  color:#fff;
  font-weight:normal;
  padding:4px 2px;
  border:1px solid #ccc;
  min-width:75px;
  font-size:12px;
  text-align:center;
}
.grid-table td.row-label{
  background:#ececec;
  padding:4px 2px;
  border:1px solid #ccc;
  min-width:36px;
  font-size:12px;
  text-align:center;
}
.grid-table td.cell-wrap{
  border:1px solid #ccc;
  vertical-align:top;
  min-width:90px;
  min-height:70px;
}
.cell{
  padding:4px;
  width:100%;
  height:100%;
}
.cell textarea{
  width:100%;
  border:none;
  outline:none;
  font-size:14px;
  resize:none;
  background:transparent;
  min-height:40px;
}
.cell-img{
  max-width:100%;
  border-radius:4px;
  cursor:pointer;
  margin-top:4px;
}
.cell-tool{
  font-size:11px;
  display:flex;gap:4px;margin-top:4px;
}
.cell-tool button{
  border:none;background:#eee;font-size:10px;padding:1px 3px;border-radius:3px;cursor:pointer;
}
.card-tool{
  margin-top:6px;
  display:flex;gap:4px;
  flex-wrap:wrap;
}
.card-tool button{
  border:none;background:#eee;font-size:11px;padding:2px 4px;border-radius:4px;cursor:pointer;
}
.toolbar{
  position:fixed;top:12px;left:12px;
  background:#fff;padding:10px;border-radius:8px;box-shadow:0 2px 10px #0002;
  z-index:999;
}
.toolbar button{
  border:none;background:#00a854;color:#fff;padding: 6px 10px;border-radius:6px;margin: 0 3px;cursor:pointer;
}
.color-set{margin-top:6px;}
.color-set span{
  display: inline-block;width:20px;height:20px;border-radius:4px;margin: 0 2px;cursor:pointer;border:1px solid #888;
}
.tip{position:fixed;bottom:12px;left:12px;background:#fff;padding:6px 10px;border-radius:6px;font-size:12px;color:#555;box-shadow:0 2px  8px #0002;}
.img-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.img-modal img{
  max-width:100%;
  max-height:100%;
}
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="addCard()">新增表格相册</button>
  <button onclick="uploadImg()">单元格插入图片</button>
  <div class="color-set">
    <span style="background:#fff9b0" onclick="setCardColor('y')" title="黄色"></span>
    <span style="background:#e6f2ff" onclick="setCardColor('b')" title="浅蓝"></span>
    <span style="background:#ffeef6" onclick="setCardColor('p')" title="浅粉"></span>
    <span style="background:#ffffff" onclick="setCardColor('w')" title="白色"></span>
  </div>
</div>
<div id="canvasWrap">
  <div id="canvas"></div>
</div>
<div class="tip">拖拽画布移动｜滚轮缩放表格卡片｜点图片放大查看</div>
<input type="file" id="imgInput" accept="image/*" style="display:none"/>
<div class="img-modal" id="imgModal" onclick="closeModal()">
  <img id="modalImg"/>
</div>
<script>
let state = JSON.parse(localStorage.getItem('alu-data')) || {cards:[], scale:1, offsetX:0, offsetY:0};
let activeCardId = null;
let activeCell = null;
const canvas = document.getElementById('canvas');
const wrap = document.getElementById('canvasWrap');
const modal = document.getElementById('imgModal');
const modalImg = document.getElementById('modalImg');
let dragCanvas = false;
let dragCard = null;
let dragStart = {x:0,y:0};
let saveTimer = null;

function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    localStorage.setItem('alu-data', JSON.stringify(state));
  }, 400);
}
function uuid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}
function renderAll(){
  canvas.innerHTML='';
  state.cards.forEach(c=> renderCard(c));
  canvas.style.transform = `translate(${state.offsetX}px, ${state.offsetY}px) scale(${state.scale})`;
}
function openModal(src){
  modalImg.src = src;
  modal.style.display = 'flex';
}
function closeModal(){
  modal.style.display = 'none';
}
function renderCard(card){
  const div = document.createElement('div');
  div.className = `card ${card.color||'w'}`;
  div.dataset.id = card.id;
  div.style.left = card.x+'px';
  div.style.top = card.y+'px';
  let tableHtml = `<table class="grid-table">`;
  tableHtml += `<tr><td class="row-label"></td>`;
  for(let ci=0; ci < card.grid[0].length; ci++){
    const label = String.fromCharCode(65 + ci);
    tableHtml += `<th class="col-label">${label}</th>`;
  }
  tableHtml += `</tr>`;
  card.grid.forEach((row, ri)=>{
    tableHtml += `<tr>`;
    tableHtml += `<td class="row-label">${ri+1}</td>`;
    row.forEach((cell, ci)=>{
      const cid = cell.id;
      tableHtml += `<td class="cell-wrap">
        <div class="cell">
          <textarea data-cid="${cid}">${cell.text||''}</textarea>
          ${cell.img ? `<img class="cell-img" src="${cell.img}" onclick="openModal('${cell.img}')">` : ''}
          <div class="cell-tool">
            <button onclick="clearCell('${card.id}','${cid}')">清空</button>
          </div>
        </div>
      </td>`;
    })
    tableHtml += `</tr>`;
  })
  tableHtml += `</table>`;

  div.innerHTML = `
  <div class="card-header">
    <input class="card-title" value="${card.title||'相册表格'}" />
    <div class="card-ctrl">
      <button onclick="delCard('${card.id}')">删除表格</button>
    </div>
  </div>
  <div class="table-container">${tableHtml}</div>
  <div class="card-tool">
    <button onclick="addRow('${card.id}')">+新增一行</button>
    <button onclick="addCol('${card.id}')">+新增一列</button>
    <button onclick="delRow('${card.id}')">-删除末行</button>
    <button onclick="delCol('${card.id}')">-删除末列</button>
  </div>
  `;
  div.addEventListener('mousedown',(e)=>{
    if(e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'IMG') return;
    dragCard = card;
    dragStart = {x:e.clientX - card.x, y:e.clientY - card.y};
    activeCardId = card.id;
  })
  const titleInput = div.querySelector('.card-title');
  titleInput.oninput = ()=>{
    card.title = titleInput.value;
    save();
  }
  const texts = div.querySelectorAll('textarea');
  texts.forEach(t=>{
    t.oninput = ()=>{
      const cid = t.dataset.cid;
      for(let r of card.grid){
        for(let c of r){
          if(c.id === cid){
            c.text = t.value;
          }
        }
      }
      save();
    }
    t.onfocus = ()=>{
      activeCell = {cardId:card.id, cellId: t.dataset.cid};
    }
  })
  canvas.appendChild(div);
}
function newCell(){
  return {
    id: uuid(),
    text:'',
    img:null
  }
}
function addCard(){
  const newCard = {
    id: uuid(),
    title:"相册表格",
    x: -state.offsetX/state.scale + 120,
    y: -state.offsetY/state.scale + 100,
    color:'w',
    grid: [
      [newCell(), newCell(), newCell()],
      [newCell(), newCell(), newCell()],
      [newCell(), newCell(), newCell()]
    ]
  }
  state.cards.push(newCard);
  save(); renderAll();
}
function delCard(id){
  state.cards = state.cards.filter(x=>x.id!==id);
  save(); renderAll();
}
function setCardColor(c){
  if(!activeCardId) return;
  const cObj = state.cards.find(x=>x.id===activeCardId);
  if(cObj){
    cObj.color = c;
    save(); renderAll();
  }
}
function addRow(cardId){
  const c = state.cards.find(x=>x.id===cardId);
  if(!c) return;
  const colLen = c.grid[0].length;
  let newRow = [];
  for(let i=0;i<colLen;i++) newRow.push(newCell());
  c.grid.push(newRow);
  save(); renderAll();
}
function addCol(cardId){
  const c = state.cards.find(x=>x.id===cardId);
  if(!c) return;
  c.grid.forEach(r=> r.push(newCell()));
  save(); renderAll();
}
function delRow(cardId){
  const c = state.cards.find(x=>x.id===cardId);
  if(!c || c.grid.length <=1) return;
  c.grid.pop();
  save(); renderAll();
}
function delCol(cardId){
  const c = state.cards.find(x=>x.id===cardId);
  if(!c || c.grid[0].length <=1) return;
  c.grid.forEach(r=> r.pop());
  save(); renderAll();
}
function clearCell(cardId, cellId){
  const c = state.cards.find(x=>x.id===cardId);
  if(!c) return;
  for(let r of c.grid){
    for(let cell of r){
      if(cell.id === cellId){
        cell.text = '';
        cell.img = null;
      }
    }
  }
  save(); renderAll();
}
function uploadImg(){
  if(!activeCell) return;
  document.getElementById('imgInput').click();
}
document.getElementById('imgInput').onchange = async (e)=>{
  const f = e.target.files[0];
  if(!f || !activeCell) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const c = state.cards.find(x=>x.id === activeCell.cardId);
    if(!c) return;
    for(let r of c.grid){
      for(let cell of r){
        if(cell.id === activeCell.cellId){
          cell.img = ev.target.result;
        }
      }
    }
    save(); renderAll();
  }
  reader.readAsDataURL(f);
}
wrap.addEventListener('mousedown',(e)=>{
  if(e.target !== canvas) return;
  dragCanvas = true;
  dragStart = {x:e.clientX, y:e.clientY};
})
document.addEventListener('mousemove',(e)=>{
  if(dragCard){
    dragCard.x = (e.clientX - dragStart.x)/state.scale;
    dragCard.y = (e.clientY - dragStart.y)/state.scale;
    save(); renderAll();
    return;
  }
  if(dragCanvas){
    state.offsetX += e.clientX - dragStart.x;
    state.offsetY += e.clientY - dragStart.y;
    dragStart = {x:e.clientX, y:e.clientY};
    canvas.style.transform = `translate(${state.offsetX}px, ${state.offsetY}px) scale(${state.scale})`;
  }
})
document.addEventListener('mouseup',()=>{
  dragCanvas = false; dragCard = null;
})
wrap.addEventListener('wheel',(e)=>{
  e.preventDefault();
  const delta = e.deltaY>0 ? -0.07 : 0.07;
  state.scale = Math.max(0.3, Math.min(2, state.scale + delta));
  canvas.style.transform = `translate(${state.offsetX}px, ${state.offsetY}px) scale(${state.scale})`;
  save();
})
renderAll();
</script>
</body>
</html>
